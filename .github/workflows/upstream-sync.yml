name: Sync from upstream (stable)

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      pushover_test:
        description: "Send a Pushover test notification (no sync)."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pushover_test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' && secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git || true
          git fetch upstream stable --prune

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase fork stable onto upstream stable
        run: |
          git checkout stable
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com" \
          git rebase upstream/stable

      - name: Enforce no upgrades in profiles
        run: |
          find profiles -name '*.yml' -print0 | xargs -0 sed -i 's/^upgradesAllowed: true$/upgradesAllowed: false/'
          if ! git diff --quiet; then
            git add profiles/*.yml
            git commit -m "chore: disable upgrades in profiles"
          fi

      - name: Push back to fork
        run: |
          git push origin stable --force-with-lease

      - name: Notify Pushover on failure
        if: failure()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "Pushover secrets not set; skipping notification."
            exit 0
          fi
          curl -s \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Database sync failed" \
            --form-string "message=Upstream sync failed for $GITHUB_REPOSITORY on branch stable. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            https://api.pushover.net/1/messages.json

  pushover-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pushover_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Pushover test notification
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "Pushover secrets not set; cannot send test."
            exit 1
          fi
          curl -s \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Database sync test" \
            --form-string "message=This is a test Pushover notification for $GITHUB_REPOSITORY." \
            https://api.pushover.net/1/messages.json
