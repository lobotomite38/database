name: Sync from upstream (stable)

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git || true
          git fetch upstream stable --prune

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase fork stable onto upstream stable
        run: |
          git checkout stable
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com" \
          git rebase upstream/stable

      - name: Enforce no upgrades in profiles
        run: |
          find profiles -name '*.yml' -print0 | xargs -0 sed -i 's/^upgradesAllowed: true$/upgradesAllowed: false/'
          if ! git diff --quiet; then
            git add profiles/*.yml
            git commit -m "chore: disable upgrades in profiles"
          fi

      - name: Push back to fork
        run: |
          git push origin stable --force-with-lease
